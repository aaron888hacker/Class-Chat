    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: '微软雅黑', sans-serif;
        }

        body {
            background-color: #f0f8ff;
            min-height: 100vh;
            padding: 10px;
        }

        /* 登录页样式 */
        .login-box {
            max-width: 350px;
            margin: 80px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 15px rgba(0,0,0,0.1);
        }

        .login-box h2 {
            color: #333;
            text-align: center;
            margin-bottom: 25px;
            font-size: 1.5rem;
        }

        .login-input {
            width: 100%;
            padding: 12px 15px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 1rem;
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background: #5cb85c;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .login-tip {
            color: #f00;
            text-align: center;
            margin-top: 10px;
            font-size: 0.9rem;
            display: none;
        }

        /* 聊天页样式 */
        .chat-box {
            max-width: 700px;
            height: 90vh;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 2px 15px rgba(0,0,0,0.1);
            display: none;
            flex-direction: column;
        }

        .chat-header {
            background: #5cb85c;
            color: white;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
        }

        .chat-content {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            background-color: #f9f9f9;
        }

        .msg {
            margin-bottom: 12px;
            max-width: 70%;
        }

        .msg.me {
            margin-left: auto;
        }

        .msg-content {
            padding: 8px 12px;
            border-radius: 15px;
            word-wrap: break-word;
        }

        .msg.other .msg-content {
            background: white;
            border: 1px solid #eee;
        }

        .msg.me .msg-content {
            background: #5cb85c;
            color: white;
        }

        .input-area {
            display: flex;
            padding: 10px;
            border-top: 1px solid #eee;
        }

        #msg-input {
            flex: 1;
            padding: 10px 15px;
            border: 1px solid #ddd;
            border-radius: 20px;
        }

        #send-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #5cb85c;
            color: white;
            border: none;
            margin-left: 10px;
            cursor: pointer;
        }

        .status-bar {
            padding: 5px 15px;
            font-size: 0.8rem;
            color: #666;
            background: #f5f5f5;
        }
    </style>
</head>

        // SHA-256加密函数
        async function sha256(str) {
            const encoder = new TextEncoder();
            const data = encoder.encode(str);
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            return Array.from(new Uint8Array(hashBuffer))
                .map(b => b.toString(16).padStart(2, '0'))
                .join('');
        }

        // 登录逻辑
        async function handleLogin() {
            const username = document.getElementById("loginName").value.trim();
            const password = document.getElementById("loginPwd").value.trim();

            if (!username || !password) {
                showTip("请输入用户名和密码");
                return;
            }

            // 查找用户
            const user = users.find(u => u.name === username);
            if (!user) {
                showTip("用户名不存在（当前支持1-15）");
                return;
            }

            // 验证密码
            const inputHash = await sha256(password + user.salt);
            if (inputHash === user.hash) {
                currentUser = username;
                document.getElementById("loginBox").style.display = "none";
                document.getElementById("chatBox").style.display = "flex";
                initChat();
            } else {
                showTip("密码错误");
            }
        }

        // 显示提示
        function showTip(text) {
            const tip = document.getElementById("loginTip");
            tip.textContent = text;
            tip.style.display = "block";
            setTimeout(() => tip.style.display = "none", 2000);
        }

        // 初始化聊天
        function initChat() {
            loadMessages();
            setInterval(loadMessages, 3000);
            document.getElementById("send-btn").addEventListener("click", sendMessage);
            document.getElementById("msg-input").addEventListener("keypress", (e) => {
                if (e.key === "Enter") sendMessage();
            });
            updateStatus(`欢迎，用户${currentUser}！`);
        }

        // 加载消息
        async function loadMessages() {
            try {
                const response = await fetch(apiUrl);
                if (!response.ok) throw new Error("加载失败");
                
                const data = await response.json();
                const content = atob(data.content);
                const messages = content ? JSON.parse(content) : [];

                if (messages.length > lastMsgCount) {
                    renderMessages(messages);
                    lastMsgCount = messages.length;
                    updateStatus(`最后更新：${new Date().toLocaleTimeString()}`);
                }
            } catch (error) {
                console.error("加载消息失败：", error);
                updateStatus("加载失败，请刷新");
            }
        }
